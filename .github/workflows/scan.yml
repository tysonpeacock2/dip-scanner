name: Daily dip scan

on:
  schedule:
    # 22:30 UTC Mon–Fri = 5:30pm Toronto in winter, 6:30pm in summer — after both exchanges close
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: dip-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name "dip-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ universe_cache.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Scan $(date -u +%Y-%m-%d)"
            git push
          fi
